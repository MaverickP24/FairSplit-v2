<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FairSplit</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --color-background-primary: #ffffff;
        --color-background-secondary: #f5f5f3;
        --color-background-tertiary: #eeece6;
        --color-background-success: #e1f5ee;
        --color-background-danger: #fcebeb;
        --color-background-warning: #faeeda;
        --color-background-info: #e6f1fb;
        --color-text-primary: #1a1a18;
        --color-text-secondary: #5f5e5a;
        --color-text-tertiary: #888780;
        --color-text-success: #085041;
        --color-text-danger: #791f1f;
        --color-text-warning: #633806;
        --color-text-info: #0c447c;
        --color-border-tertiary: rgba(0,0,0,0.10);
        --color-border-secondary: rgba(0,0,0,0.18);
        --color-border-primary: rgba(0,0,0,0.28);
        --border-radius-md: 8px;
        --border-radius-lg: 12px;
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: "SF Mono", "Fira Code", monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --color-background-primary: #1a1a18;
          --color-background-secondary: #242422;
          --color-background-tertiary: #2c2c2a;
          --color-background-success: #04342c;
          --color-background-danger: #501313;
          --color-background-warning: #412402;
          --color-background-info: #042c53;
          --color-text-primary: #e8e6df;
          --color-text-secondary: #b4b2a9;
          --color-text-tertiary: #888780;
          --color-text-success: #9fe1cb;
          --color-text-danger: #f09595;
          --color-text-warning: #fac775;
          --color-text-info: #85b7eb;
          --color-border-tertiary: rgba(255,255,255,0.10);
          --color-border-secondary: rgba(255,255,255,0.18);
          --color-border-primary: rgba(255,255,255,0.28);
        }
      }
      body {
        font-family: var(--font-sans);
        background: var(--color-background-tertiary);
        color: var(--color-text-primary);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      button { font-family: inherit; }
      input, select, textarea { font-family: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
